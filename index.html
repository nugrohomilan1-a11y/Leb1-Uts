
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>

    <main class="login-container">
        <section class="login-box">

            <h1>Toko Buku Online</h1>
            <p>Silakan login untuk melanjutkan</p>

            <form id="formLogin">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Login
                </button>

            </form>

            <div class="login-links">
                <button type="button" id="btnLupa">
                    Lupa Password?
                </button>

                <button type="button" id="btnDaftar">
                    Daftar
                </button>
            </div>

        </section>
    </main>

    <!-- Modal Lupa Password -->
    <div id="modalLupa" class="modal">
        <div class="modal-content">
            <h2>Lupa Password</h2>
            <p>Silakan hubungi admin untuk bantuan akun.</p>
            <button type="button" class="btn-tutup">Tutup</button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <h2>Daftar Akun</h2>
            <p>Silakan hubungi admin untuk membuat akun baru.</p>
            <button type="button" class="btn-tutup">Tutup</button>
        </div>
    </div>

</body>
</html>
